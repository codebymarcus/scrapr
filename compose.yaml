# Production-style stack: one command brings up the whole dashboard.
#
#   docker compose up --build
#
# Then open http://localhost:8080  (change the port with WEB_PORT=...; if you
# serve it on another host/port, also set PUBLIC_API_BASE / PUBLIC_WS_BASE to
# that same origin so the built SPA points at it).
name: scrapr

services:
  server:
    build:
      context: .
      dockerfile: dashboard/server/Dockerfile
    # Drive OAuth / APP_SECRET_KEY can live in dashboard/server/.env (gitignored).
    # required: false → the stack still starts when the file is absent.
    env_file:
      - path: ./dashboard/server/.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "5174"
      NODE_ENV: production
      # Google Drive (recommended): the dashboard's in-app "Connect Google
      # Drive" button. Set these here OR in dashboard/server/.env (see env_file
      # above), then restart.
      #   Client ID/secret: a Google Cloud OAuth "Web application" client.
      # GOOGLE_OAUTH_CLIENT_ID: "<client-id>.apps.googleusercontent.com"
      # GOOGLE_OAUTH_CLIENT_SECRET: "<client-secret>"
      #   IMPORTANT: must equal the origin you browse the dashboard from plus
      #   /api/drive/callback (default compose: http://localhost:8080), and be
      #   registered as an authorized redirect URI on the Google OAuth client.
      #   The server's own :5174 will NOT work (the OAuth state cookie is
      #   per-origin).
      # GOOGLE_OAUTH_REDIRECT_URI: "http://localhost:8080/api/drive/callback"
      #   Base64-encoded 32-byte key that encrypts the stored Drive token.
      #   Generate: openssl rand -base64 32
      #     or: node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      #   Without it Drive stays "not configured".
      # APP_SECRET_KEY: "<base64-32-byte-key>"
    volumes:
      # Queue DB + run outputs survive restarts.
      - scrapr-data:/app/dashboard/server/data
      # CLI / terminal use only (the dashboard doesn't need these when you use
      # the in-app Connect button above): run `node authorize.mjs` on the host
      # to create credentials.json + token.json, then uncomment to mount them.
      # - ./credentials.json:/app/credentials.json:ro
      # - ./token.json:/app/token.json:ro
    expose:
      - "5174"
    restart: unless-stopped

  web:
    build:
      context: ./dashboard/web
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_API_BASE: ${PUBLIC_API_BASE:-http://localhost:8080}
        VITE_WS_BASE: ${PUBLIC_WS_BASE:-ws://localhost:8080}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  scrapr-data:

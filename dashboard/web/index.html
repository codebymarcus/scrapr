<!doctype html>
<html lang="en" data-theme="dark" data-grain>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scrapr</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        const preferences = JSON.parse(
          localStorage.getItem("scrapr-preferences") || "{}",
        );

        const state = preferences.state;
        const root = document.documentElement;

        if (state?.theme === "light" || state?.theme === "dark") {
          root.dataset.theme = state.theme;
        }

        // Grain defaults to on (the attribute is in the markup above); only a
        // saved `false` removes it, so there is no grain flash before React.
        if (state?.grain === false) {
          root.removeAttribute("data-grain");
        } else if (state?.grain === true) {
          root.setAttribute("data-grain", "");
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

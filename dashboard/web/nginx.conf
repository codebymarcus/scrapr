# Serves the built SPA and reverse-proxies the API (REST + WebSocket) to the
# `server` service, so the browser talks to a single same-origin host.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # WebSocket for live run events (must come before the generic /api/ block).
  location /api/ws {
    proxy_pass http://server:5174;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
  }

  # REST API.
  location /api/ {
    proxy_pass http://server:5174;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA: serve the file if it exists, else fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
